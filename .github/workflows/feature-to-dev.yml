name: Auto-merge Feature → Dev

on:
  push:
    branches:
      - 'feature/**'

jobs:
  merge-into-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Trazer branches
        run: |
          git fetch origin dev

      - name: Fazer merge e push para dev
        run: |
          git checkout dev
          set +e
          git merge --no-ff ${{ github.ref_name }} -m "chore: auto-merge ${{ github.ref_name }} → dev"
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "❌ Merge conflict detected. Please resolve manually."
            git merge --abort
            exit 0
          fi
          git push origin dev

